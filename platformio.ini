[platformio]
src_dir = firmware

[env:xiao_camera]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
